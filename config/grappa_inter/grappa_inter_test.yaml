# Canonical GrapPA particle-interaction aggregation inference configuration.
#
# Set io.loader.dataset.file_keys and model.weight_path for the target run.
# With no checkpoint, the fixed seed provides deterministic initialization for
# CI execution checks.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/grappa_inter/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected
            type_include_secondary: false
            type_include_mpr: false
            primary_include_mpr: false
        coord_label:
          parser: particle_coords
          particle_event: particle_corrected
          cluster_event: cluster3d_pcluster

model:
  name: grappa
  weight_path: null
  network_input:
    data: data
    coord_label: coord_label
  loss_input:
    clust_label: data
    coord_label: coord_label
  modules:
    grappa:
      nodes:
        source: group
        shapes: [shower, track, michel, delta]
        min_size: -1
        make_groups: true
      graph:
        name: complete
        max_length: [500, 500, 0, 0, 25, 25, 25, 0, 0, 0]
        dist_algorithm: recursive
      node_encoder:
        name: geo
        use_numpy: true
        add_value: true
        add_shape: true
        add_points: true
        add_local_dirs: true
        dir_max_dist: 5
        add_local_dedxs: true
        dedx_max_dist: 5
      edge_encoder:
        name: geo
        use_numpy: true
      gnn_model:
        name: meta
        node_feats: 33 # 16 geo + 3 extra + 6 points + 6 directions + 2 local dE/dx
        edge_feats: 19
        node_pred:
          type: 5
          primary: 2
          orient: 2
          # momentum: 1
          # vertex: 5
        edge_pred: 2
        edge_layer:
          name: mlp
          mlp:
            depth: 3
            width: 128
            activation:
              name: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          name: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 128
            activation:
              name: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 128
            activation:
              name: lrelu
              negative_slope: 0.1
            normalization: batch_norm
    grappa_loss:
      node_loss:
        type:
          name: class
          target: pid
          loss: ce
          balance_loss: true
        primary:
          name: class
          target: inter_primary
          loss: ce
          balance_loss: true
        orient:
          name: orient
          loss: ce
        # momentum:
        #   name: reg
        #   target: momentum
        #   loss: berhu
        # vertex:
        #   name: vertex
        #   primary_loss: ce
        #   balance_primary_loss: true
        #   regression_loss: mse
        #   only_contained: true
        #   normalize_positions: true
        #   use_anchor_points: true
        #   return_vertex_labels: true
        #   detector: icarus
      edge_loss:
        name: channel
        target: interaction
