# Canonical UResNet-PPN inference/evaluation configuration.
#
# Set io.loader.dataset.file_keys and model.weight_path for the target run.
# With no checkpoint, the fixed seed provides deterministic initialization for
# the CI regression test.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/uresnet_ppn/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    batch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        ppn_label:
          parser: particle_points
          sparse_event: sparse3d_pcluster
          particle_event: particle_corrected
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          particle_event: particle_corrected
          sparse_semantics_event: sparse3d_pcluster_semantics
          add_particle_info: true
          clean_data: true

model:
  name: uresnet_ppn
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
    ppn_label: ppn_label
    clust_label: clust_label
  modules:
    uresnet:
      num_input: 1
      num_classes: 5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        name: lrelu
        negative_slope: 0.33
      norm_layer:
        name: batch_norm
        eps: 0.0001
        momentum: 0.01
    ppn:
      classify_endpoints: false
    uresnet_loss:
      balance_loss: false
    ppn_loss:
      mask_loss: CE
      resolution: 5.0
      restrict_to_clusters: true
