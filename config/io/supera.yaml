# Native pysupera 4.1 truth-deposit input for segmentation, PPN and fragmentation.
# Merge this io block into a training configuration; no conversion is required.
io:
  loader:
    batch_size: 1
    num_workers: 0
    shuffle: true
    dataset:
      provider: supera
      file_keys: supera_pixel_j000000-000004.h5
      schema:
        data:
          provider: tensor
        seg_label:
          provider: segmentation
        clust_label:
          provider: cluster_label
        ppn_label:
          provider: particle_points
        particles:
          provider: particle
    collate_fn:
      provider: all
