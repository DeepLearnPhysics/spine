# Native pysupera 4.1 input for generic-chain training and truth conversion.
# data contains truth-deposit energy (MeV), not measured pixel charge.
# Merge this io block into a training configuration; no conversion is required.
io:
  loader:
    batch_size: 1
    num_workers: 0
    shuffle: true
    dataset:
      provider: supera
      file_keys: supera_pixel_j000000-000004.h5
      schema:
        data:
          provider: tensor
        seg_label:
          provider: segmentation
        clust_label:
          provider: cluster_label
        ppn_label:
          provider: particle_points
        coord_label:
          provider: particle_coords
        graph_label:
          provider: particle_graph
        particles:
          provider: particle
        meta:
          provider: meta
        source_ids:
          provider: source_ids
        event_info:
          provider: event_info
    collate_fn:
      provider: all
