# Shared UResNet with independent semantic coupling.
# Inherits the canonical data, backbone and objective configuration.

include: uresnet_multi_train.yaml

base:
  log_dir: logs/uresnet_multi_independent/train

train:
  weight_prefix: weights/uresnet_multi_independent/snapshot

model:
  modules:
    semantic_coupling: independent
    fragment_semantics: pooled
    graph_spice:
      make_clusters: true
