# Shared UResNet with fragment-first semantic coupling.
# Inherits the canonical data, backbone and objective configuration.

include: uresnet_multi_train.yaml

base:
  log_dir: logs/uresnet_multi_fragment_first/train

train:
  weight_prefix: weights/uresnet_multi_fragment_first/snapshot

model:
  modules:
    semantic_coupling: fragment_first
    fragment_semantics: learned
    graph_spice:
      make_clusters: true
