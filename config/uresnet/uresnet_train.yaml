# Canonical UResNet semantic-segmentation training configuration.
#
# Set io.loader.dataset.file_keys to the training data and adjust the output
# paths for the target environment before launching a production job.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/uresnet/train
  log_step: 1

train:
  weight_prefix: weights/uresnet/snapshot
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          provider: sparse3d
          sparse_event: sparse3d_pcluster_semantics

model:
  provider: uresnet
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
  modules:
    uresnet:
      num_input: 1
      num_classes: 5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        provider: lrelu
        negative_slope: 0.33
      norm_layer:
        provider: batch_norm
        eps: 0.0001
        momentum: 0.01
    uresnet_loss:
      balance_loss: false
