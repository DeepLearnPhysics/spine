# Canonical Bayesian UResNet Monte Carlo dropout inference configuration.
#
# Set io.loader.dataset.file_keys and model.weight_path for the target run.
# Four stochastic samples keep the maintained smoke test reasonably fast.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/uresnet_bayes/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics

model:
  name: uresnet_bayes
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
  modules:
    uresnet_bayes:
      num_input: 1
      num_classes: 5
      mode: mc_dropout
      num_samples: 4
      dropout_p: 0.5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        name: lrelu
        negative_slope: 0.33
      norm_layer:
        name: batch_norm
        eps: 0.0001
        momentum: 0.01
    uresnet_bayes_loss:
      loss: ce
      balance_loss: false
