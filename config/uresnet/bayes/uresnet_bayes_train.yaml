# Canonical Bayesian UResNet semantic-segmentation training configuration.
#
# Standard mode performs one dropout-regularized pass during training. Its
# checkpoints can be evaluated in Monte Carlo dropout mode with the companion
# inference configuration.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/uresnet_bayes/train
  log_step: 1

train:
  weight_prefix: weights/uresnet_bayes/snapshot
  save_epoch: 1.0
  optimizer:
    name: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 256
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      name: random_sequence
      seed: 0
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics

model:
  name: uresnet_bayes
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
  modules:
    uresnet_bayes:
      num_input: 1
      num_classes: 5
      mode: standard
      num_samples: 20
      dropout_p: 0.5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        name: lrelu
        negative_slope: 0.33
      norm_layer:
        name: batch_norm
        eps: 0.0001
        momentum: 0.01
    uresnet_bayes_loss:
      loss: ce
      balance_loss: false
