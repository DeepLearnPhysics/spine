# Joint particle-point and interaction-vertex training configuration.
# Set proposal_decoder.shared to true to compare a shared proposal path.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/uresnet_ppn_vertex/train
  log_step: 1

train:
  weight_prefix: weights/uresnet_ppn_vertex/snapshot
  save_epoch: 1.0
  optimizer:
    name: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      name: random_sequence
      seed: 0
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        ppn_label:
          parser: particle_points
          sparse_event: sparse3d_pcluster
          particle_event: particle_corrected
        vertex_label:
          parser: vertex_points
          sparse_event: sparse3d_pcluster
          particle_event: particle_corrected
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected

model:
  name: uresnet_ppn
  weight_path: null
  network_input:
    data: data
  loss_input:
    seg_label: seg_label
    ppn_label: ppn_label
    vertex_label: vertex_label
    clust_label: clust_label
  modules:
    uresnet:
      num_input: 1
      num_classes: 5
      filters: 32
      depth: 5
      reps: 2
      allow_bias: false
      activation:
        name: lrelu
        negative_slope: 0.33
      norm_layer:
        name: batch_norm
        eps: 0.0001
        momentum: 0.01
    proposal_decoder:
      shared: false
    ppn:
      classify_endpoints: false
    vertex:
      mask_score_threshold: 0.5
    uresnet_loss:
      balance_loss: false
    ppn_loss:
      mask_loss: CE
      resolution: 5.0
      restrict_to_clusters: true
    vertex_loss:
      mask_loss: CE
      resolution: 5.0
