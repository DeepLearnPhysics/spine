# Analyzer fragment which emits every raw record consumed by spine-report.
__meta__:
  kind: fragment
  version: "240805"

# SaveAna needs constructed fragments for fragment-node evaluation. This block
# merges into the full-chain builder configuration when included last.
build:
  fragments: true

# The production ICARUS bundle builds particles without materializing the PPN
# candidates used by PointProposalAna. Object matching must also include
# fragments because the standard production bundle only matches particles and
# interactions. These entries merge with, rather than replace, the remaining
# full-chain postprocessors.
post:
  ppn: {}
  match:
    fragment: true

ana:
  prefix_output: true
  overwrite: true

  segment_eval:
    summary: true
    ghost: true

  point_eval: {}

  cluster_eval:
    obj_type: [fragment, particle, interaction]
    # Production inference does not produce the adapted training label. Build
    # both assignments from objects and use the truth indexes that share the
    # deghosted reconstruction point domain.
    use_objects: true
    truth_index_mode: index
    metrics: [pur, eff, ari]

  save:
    obj_type: [fragment, particle]
    run_mode: both
    match_mode: both
    fragment: [shape, size, is_primary, start_dir]
    particle:
      - shape
      - size
      - pid
      - is_primary
      - start_dir
      - ke
      - pdg_code
      - parent_pdg_code
