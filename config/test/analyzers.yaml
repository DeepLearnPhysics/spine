# Generic analyzer fragment which emits every record consumed by spine-report.

# SaveAna needs constructed fragments for fragment-node evaluation. This block
# merges into the full-chain builder configuration when included last.
build:
  fragments: true

# Edit the ordered post-processing list from the full-chain base. Keep the
# previous execution order: existing processors, then PPN candidate extraction.
override:
  post.stages~:
    - update:
        name: match
        changes:
          # Full-chain truth objects use the semantic-adapted point cloud.
          truth_point_mode: points_adapt
          fragment: true
    - insert:
        after: match
        value:
          name: ppn

ana:
  prefix_output: true
  overwrite: true

  stages:
  - name: segment_eval
    summary: true
    ghost: false

  - name: point_eval

  - name: cluster_eval
    obj_type: [fragment, particle, interaction]
    # Build both assignments from objects so inference does not need to retain
    # the adapted training label tensor.
    use_objects: true
    truth_index_mode: index_adapt
    metrics: [pur, eff, ari]

  - name: save
    obj_type: [fragment, particle]
    run_mode: both
    match_mode: both
    # Reconstructed `is_primary` is the fragment-node prediction. The physical
    # cascade-primary label is `group_primary`; TruthFragment.is_primary is not
    # filled. This does not reproduce a loss configured with `use_closest`.
    # Truth fragment `size` refers to the unadapted index and is zero after a
    # full-chain build. Store `size_adapt` for quality selections instead.
    fragment: [shape, size, size_adapt, is_primary, group_primary, start_dir]
    particle:
      - shape
      - size
      - pid
      - is_primary
      - start_dir
      - ke
      - pdg_code
      - parent_pdg_code
      - nu_id
