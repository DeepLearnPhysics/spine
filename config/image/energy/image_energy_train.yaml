# Canonical whole-image energy-regression training configuration.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/image/energy/train
  log_step: 1

train:
  weight_prefix: weights/image/energy/snapshot
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        labels:
          provider: single_particle_energy
          particle_event: particle_corrected

model:
  provider: image
  weight_path: null
  network_input:
    data: data
  loss_input:
    labels: labels
  modules:
    image:
      objects:
        source: image
      encoder:
        provider: cnn
        num_input: 1
        spatial_size: 768
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          provider: lrelu
          negative_slope: 0.33
        norm_layer:
          provider: batch_norm
          eps: 0.0001
          momentum: 0.01
      heads:
        energy: 1
    image_loss:
      energy:
        provider: reg
        label: labels
        loss: huber
        ignore_value: -1.0
