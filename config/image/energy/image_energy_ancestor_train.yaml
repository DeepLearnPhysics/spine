# Canonical ancestor-tree kinetic-energy regression training configuration.
#
# Each image-model sample contains all selected voxels sharing one ancestor ID.
# The target is the root ancestor's initial kinetic energy, derived from its
# initial momentum and PID-dependent rest mass.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/image/energy_ancestor/train
  log_step: 1

train:
  weight_prefix: weights/image/energy_ancestor/snapshot
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected

model:
  provider: image
  weight_path: null
  network_input:
    data: data
    object_data: data
  loss_input:
    clust_label: data
  modules:
    image:
      objects:
        source: ancestor
        shapes: [shower, track, michel, delta]
        min_size: -1
      encoder:
        provider: cnn
        num_input: 1
        spatial_size: 768
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          provider: lrelu
          negative_slope: 0.33
        norm_layer:
          provider: batch_norm
          eps: 0.0001
          momentum: 0.01
      heads:
        energy: 1
    image_loss:
      energy:
        provider: reg
        label: clust_label
        target: kinetic_energy
        target_reduction: ancestor
        loss: huber
        ignore_value: -1.0
