# Canonical whole-image energy-regression inference configuration.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/image/energy/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        labels:
          parser: single_particle_energy
          particle_event: particle_corrected

model:
  name: image
  weight_path: null
  network_input:
    data: data
  loss_input:
    labels: labels
  modules:
    image:
      objects:
        source: image
      encoder:
        name: cnn
        num_input: 1
        spatial_size: 768
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          name: lrelu
          negative_slope: 0.33
        norm_layer:
          name: batch_norm
          eps: 0.0001
          momentum: 0.01
      heads:
        energy: 1
    image_loss:
      energy:
        name: reg
        label: labels
        loss: huber
        ignore_value: -1.0
