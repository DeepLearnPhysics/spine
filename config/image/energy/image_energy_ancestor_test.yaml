# Canonical ancestor-tree kinetic-energy regression inference configuration.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/image/energy_ancestor/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          particle_info:
            particle_event: particle_corrected

model:
  name: image
  weight_path: null
  network_input:
    data: data
    object_data: data
  loss_input:
    clust_label: data
  modules:
    image:
      objects:
        source: ancestor
        shapes: [shower, track, michel, delta]
        min_size: -1
      encoder:
        name: cnn
        num_input: 1
        spatial_size: 768
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          name: lrelu
          negative_slope: 0.33
        norm_layer:
          name: batch_norm
          eps: 0.0001
          momentum: 0.01
      heads:
        energy: 1
    image_loss:
      energy:
        name: reg
        label: clust_label
        target: kinetic_energy
        target_reduction: ancestor
        loss: huber
        ignore_value: -1.0
