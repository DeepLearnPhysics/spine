# Canonical SPICE spatial-embedding inference configuration.
#
# Set io.loader.dataset.file_keys and model.weight_path for the target run.

base:
  world_size: 0
  iterations: 1
  seed: 0
  unwrap: false
  log_dir: logs/spice/test
  log_step: 1
  overwrite_log: true

io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 0
    collate_fn: all
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          break_clusters: true
          particle_info:
            particle_event: particle_pcluster

model:
  name: spice
  weight_path: null
  network_input:
    data: data
    seg_label: seg_label
  loss_input:
    clust_label: clust_label
  modules:
    spice:
      skip_classes: [lowe]
      coord_conv: true
      margin_dim: 1
      seediness_dim: 1
      seed_freeze: false
      uresnet:
        num_input: 4
        filters: 32
        input_kernel: 5
        depth: 5
        reps: 2
        spatial_size: 768
        allow_bias: false
        activation:
          name: lrelu
          negative_slope: 0.33
        norm_layer:
          name: batch_norm
          eps: 0.0001
          momentum: 0.01
    spice_loss:
      mask_loss: bce_logits
      seed_loss: l1
      embedding_weight: 1.0
      seediness_weight: 1.0
      smoothing_weight: 1.0
      inter_weight: 1.0
      inter_margin: 0.2
      min_voxels: 2
