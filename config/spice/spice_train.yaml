# Canonical SPICE spatial-embedding training configuration.
#
# Set io.loader.dataset.file_keys to the training data and adjust output paths
# for the target environment before launching a production job.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/spice/train
  log_step: 1
  train:
    weight_prefix: weights/spice/snapshot
    save_epoch: 1.0
    optimizer:
      name: Adam
      lr: 0.001

io:
  loader:
    batch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      name: random_sequence
      seed: 0
    dataset:
      name: larcv
      file_keys: null
      schema:
        data:
          parser: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          parser: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        clust_label:
          parser: cluster3d
          cluster_event: cluster3d_pcluster
          particle_event: particle_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          add_particle_info: true
          clean_data: true
          break_clusters: true

model:
  name: spice
  weight_path: null
  network_input:
    data: data
    seg_label: seg_label
  loss_input:
    clust_label: clust_label
  modules:
    spice:
      skip_classes: [michel, delta, lowe]
      coord_conv: true
      margin_dim: 1
      seediness_dim: 1
      seed_freeze: false
      uresnet:
        num_input: 4
        filters: 32
        input_kernel: 5
        depth: 5
        reps: 2
        spatial_size: 6144
        allow_bias: false
        activation:
          name: lrelu
          negative_slope: 0.33
        norm_layer:
          name: batch_norm
          eps: 0.0001
          momentum: 0.01
    spice_loss:
      mask_loss: bce_logits
      seed_loss: l1
      embedding_weight: 1.0
      seediness_weight: 1.0
      smoothing_weight: 1.0
      inter_weight: 1.0
      inter_margin: 0.2
      min_voxels: 2
