# Canonical GrapPA track-fragment aggregation training configuration.
#
# Set io.loader.dataset.file_keys to the training data and adjust the output
# paths for the target environment before launching a production job.

base:
  world_size: 1
  epochs: 25.0
  seed: 0
  unwrap: false
  log_dir: logs/grappa_track/train
  log_step: 1

train:
  weight_prefix: weights/grappa_track/snapshot
  save_epoch: 1.0
  optimizer:
    provider: Adam
    lr: 0.001

io:
  loader:
    minibatch_size: 64
    shuffle: false
    num_workers: 8
    collate_fn: all
    sampler:
      provider: random_sequence
      seed: 0
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          break_clusters: true
          particle_info:
            particle_event: particle_corrected
        coord_label:
          provider: particle_coords
          particle_event: particle_corrected
          cluster_event: cluster3d_pcluster

model:
  provider: grappa
  weight_path: null

  network_input:
    data: data
    coord_label: coord_label
  loss_input:
    clust_label: data

  modules:
    grappa:
      nodes:
        source: cluster
        shapes: [track]
        min_size: -1
      graph:
        provider: complete
        max_length: 100
        dist_algorithm: recursive
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: false
        add_points: true
        add_local_dirs: true
        dir_max_dist: 5
        add_local_dedxs: true
        dedx_max_dist: 5
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 32 # 16 (geo) + 2 (extra) + 6 (points) + 6 (directions) + 2 (local dedxs)
        edge_feats: 19
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm

    grappa_loss:
      edge_loss:
        provider: channel
        target: group
