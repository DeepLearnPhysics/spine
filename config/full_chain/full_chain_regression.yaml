__meta__:
  version: "260803"
  description: Deterministic end-to-end full-chain regression configuration

base:
  world_size: 0
  iterations: -1
  seed: 0
  dtype: float32
  unwrap: true
  log_dir: logs
  prefix_log: true
  overwrite_log: true
  log_step: 1
  split_output: true
build:
  mode: both
  units: cm
  fragments: false
  particles: true
  interactions: true
io:
  loader:
    minibatch_size: 2
    shuffle: false
    num_workers: 8
    collate_fn: all
    dataset:
      provider: larcv
      file_keys: null
      schema:
        data:
          provider: sparse3d
          sparse_event: sparse3d_pcluster
        seg_label:
          provider: sparse3d
          sparse_event: sparse3d_pcluster_semantics
        ppn_label:
          provider: particle_points
          sparse_event: sparse3d_pcluster
          particle_event: particle_corrected
          include_point_tagging: false
        clust_label:
          provider: cluster3d
          cluster_event: cluster3d_pcluster
          sparse_semantics_event: sparse3d_pcluster_semantics
          clean_data: true
          shape_precedence:
          - 2
          - 1
          - 0
          - 3
          - 4
          - 6
          particle_info:
            particle_event: particle_corrected
        coord_label:
          provider: particle_coords
          particle_event: particle_corrected
          cluster_event: cluster3d_pcluster
        graph_label:
          provider: particle_graph
          particle_event: particle_pcluster
        particles:
          provider: particle
          particle_event: particle_pcluster
          cluster_event: cluster3d_pcluster
        meta:
          provider: meta3d
          sparse_event: sparse3d_pcluster
        run_info:
          provider: run_info
          sparse_event: sparse3d_pcluster
  writer:
    provider: hdf5
    file_name: null
    overwrite: true
    keys:
    - run_info
    - meta
    - points
    - points_label
    - depositions
    - depositions_label
    - reco_particles
    - truth_particles
    - reco_interactions
    - truth_interactions
model:
  provider: full_chain
  to_numpy: true
  network_input:
    data: data
    seg_label: seg_label
    clust_label: clust_label
  loss_input:
    seg_label: seg_label
    ppn_label: ppn_label
    clust_label: clust_label
    coord_label: coord_label
  modules:
    chain:
      stages:
      - name: segmentation
        provider: segmentation
        uses: uresnet_ppn
        loss: uresnet_ppn_loss
        config:
          mode: uresnet
          point_proposal: ppn
      - name: fragmentation
        provider: fragmentation
        uses: graph_spice
        loss: graph_spice_loss
        config:
          mode: graph_spice
      - name: particle_aggregation
        provider: particle_aggregation
        uses:
        - grappa_shower
        - grappa_track
        loss:
          shower: grappa_shower_loss
          track: grappa_track_loss
        config:
          shower_aggregation: grappa
          shower_primary: grappa
          track_aggregation: grappa
          particle_aggregation: null
      - name: interaction_aggregation
        provider: interaction_aggregation
        uses: grappa_inter
        loss: grappa_inter_loss
        config:
          mode: grappa
          task_modes:
            type: grappa
            primary: grappa
            orient: grappa
    uresnet_ppn:
      uresnet:
        num_input: 1
        num_classes: 5
        filters: 32
        depth: 5
        reps: 2
        allow_bias: false
        activation:
          provider: lrelu
          negative_slope: 0.33
        norm_layer:
          provider: batch_norm
          eps: 0.0001
          momentum: 0.01
      ppn:
        classify_endpoints: false
    uresnet_ppn_loss:
      uresnet_loss:
        balance_loss: false
      ppn_loss:
        mask_loss: CE
        resolution: 5.0
    graph_spice:
      shapes:
      - shower
      - track
      - michel
      - delta
      use_raw_features: true
      invert: true
      make_clusters: true
      embedder:
        spatial_embedding_dim: 3
        feature_embedding_dim: 16
        occupancy_mode: softplus
        covariance_mode: softplus
        uresnet:
          num_input: 4
          filters: 32
          input_kernel: 5
          depth: 5
          reps: 2
          allow_bias: false
          activation:
            provider: lrelu
            negative_slope: 0.33
          norm_layer:
            provider: batch_norm
            eps: 0.0001
            momentum: 0.01
          spatial_size: 768
      kernel:
        provider: bilinear
        num_features: 32
      constructor:
        edge_threshold: 0.1
        min_size: 3
        label_edges: true
        orphan:
          mode: radius
          radius: 1.9
          iterate: true
          assign_all: true
        graph:
          provider: radius
          r: 1.9
    graph_spice_loss:
      provider: edge
      loss: binary_log_dice_ce
    grappa_shower:
      nodes:
        source: cluster
        shapes:
        - shower
        - michel
        - delta
        make_groups: true
        grouping_method: score
      graph:
        provider: complete
        max_length:
        - 500
        - 0
        - 500
        - 500
        - 0
        - 0
        - 0
        - 25
        - 0
        - 25
        dist_algorithm: iterative
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: true
        add_points: true
        add_local_dirs: true
        add_local_dedxs: true
        dir_max_dist: -1
        dedx_max_dist: -1
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 33
        edge_feats: 19
        node_pred: 2
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
    grappa_shower_loss:
      node_loss:
        provider: shower_primary
        high_purity: true
        use_closest: true
        use_group_pred: true
      edge_loss:
        provider: channel
        target: group
        high_purity: true
    grappa_track:
      nodes:
        source: cluster
        shapes:
        - track
        make_groups: true
        grouping_method: score
      graph:
        provider: complete
        max_length: 100
        dist_algorithm: iterative
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: false
        add_points: true
        add_local_dirs: true
        add_local_dedxs: true
        dir_max_dist: -1
        dedx_max_dist: -1
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 32
        edge_feats: 19
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 64
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
    grappa_track_loss:
      edge_loss:
        provider: channel
        target: group
    grappa_inter:
      nodes:
        source: group
        shapes:
        - shower
        - track
        - michel
        - delta
        min_size: -1
        make_groups: true
      graph:
        provider: complete
        max_length:
        - 500
        - 500
        - 0
        - 0
        - 25
        - 25
        - 25
        - 0
        - 0
        - 0
        dist_algorithm: iterative
      node_encoder:
        provider: geo
        use_numpy: true
        add_value: true
        add_shape: true
        add_points: true
        add_local_dirs: true
        add_local_dedxs: true
        dir_max_dist: -1
        dedx_max_dist: -1
      edge_encoder:
        provider: geo
        use_numpy: true
      gnn_model:
        provider: meta
        node_feats: 33
        edge_feats: 19
        node_pred:
          type: 5
          primary: 2
          orient: 2
        edge_pred: 2
        edge_layer:
          provider: mlp
          mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
        node_layer:
          provider: mlp
          reduction: max
          attention: false
          message_mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
          aggr_mlp:
            depth: 3
            width: 128
            activation:
              provider: lrelu
              negative_slope: 0.1
            normalization: batch_norm
    grappa_inter_loss:
      node_loss:
        type:
          provider: class
          target: pid
          loss: ce
          balance_loss: true
          min_iou: 0.5
          match_target: group
        primary:
          provider: class
          target: inter_primary
          loss: ce
          balance_loss: true
          min_iou: 0.5
          match_target: group
        orient:
          provider: orient
          loss: ce
      edge_loss:
        provider: channel
        target: interaction
  weight_path: !download
    url: https://s3df.slac.stanford.edu/data/neutrino/spine/weights/generic/generic_snapshot_240805.ckpt
    hash: 212be7374716ad23962be9b1cd5556f0556a4ec06760946b263521ad4bfdd044
post:
  stages:
  - name: shape_logic
    enforce_pid: true
    enforce_primary: true
  - name: direction
    obj_type: particle
    optimize: true
    run_mode: both
  - name: calo_ke
    scaling: 1.0
    shower_fudge: 1/0.83
  - name: csda_ke
    tracking_mode: step_next
    segment_length: 5.0
  - name: mcs_ke
    tracking_mode: bin_pca
    segment_length: 5.0
  - name: containment
    margin: 5.0
    mode: meta
  - name: vertex
    use_primaries: true
    update_primaries: false
  - name: topology_threshold
    ke_thresholds:
      4: 50
      default: 25
  - name: fiducial
    margin: 25.0
    mode: meta
  - name: children_count
    mode: shape
  - name: match
    match_mode: both
    ghost: false
    fragment: false
    particle: true
    interaction: true
